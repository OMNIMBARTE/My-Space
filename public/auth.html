<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Space — Auth</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=JetBrains+Mono:wght@300;400;500&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #060a14;
    --surface:   rgba(10,16,35,0.72);
    --border:    rgba(130,100,255,0.18);
    --border-hi: rgba(160,120,255,0.55);
    --accent:    #a855f7;
    --accent2:   #38bdf8;
    --text:      #e2d9f3;
    --muted:     #7a6f9a;
    --danger:    #f87171;
    --success:   #34d399;
  }

  html, body {
    min-height: 100%;
    font-family: 'Manrope', sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow-y: auto;
  }

  #star-canvas {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
  }

  .ambient { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .orb {
    position: absolute; border-radius: 50%;
    filter: blur(90px); opacity: 0.35;
    animation: drift 18s ease-in-out infinite alternate;
  }
  .o1 { width:500px; height:500px; background:#6d28d9; top:-120px; left:-100px; animation-duration:22s; }
  .o2 { width:400px; height:400px; background:#0ea5e9; bottom:-100px; right:-80px; animation-duration:18s; animation-delay:-6s; }
  .o3 { width:300px; height:300px; background:#7c3aed; top:40%; left:55%; animation-duration:15s; animation-delay:-10s; }
  @keyframes drift { to { transform: translate(40px, 30px) scale(1.08); } }

  .grain {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    opacity: 0.55;
  }

  #cursor-glow {
    position: fixed; width: 280px; height: 280px;
    border-radius: 50%; pointer-events: none; z-index: 2;
    background: radial-gradient(circle, rgba(168,85,247,0.12) 0%, transparent 70%);
    transform: translate(-50%, -50%);
  }

  .scene {
    position: relative; z-index: 3;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px 20px;
  }

  .auth-card {
    width: 100%; max-width: 440px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 40px 36px 36px;
    backdrop-filter: blur(28px) saturate(160%);
    box-shadow:
      0 0 0 1px rgba(168,85,247,0.07),
      0 8px 40px rgba(0,0,0,0.55),
      0 0 80px rgba(168,85,247,0.08);
    animation: cardIn 0.7s cubic-bezier(.22,1,.36,1) both;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(32px) scale(0.97); }
    to   { opacity: 1; transform: none; }
  }

  .brand {
    font-family: 'Orbitron', monospace;
    font-size: 13px; font-weight: 700;
    letter-spacing: 0.22em; color: var(--accent);
    text-transform: uppercase;
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 28px;
  }
  .brand-star { font-size: 16px; animation: spin 8s linear infinite; display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .tab-row {
    display: flex;
    background: rgba(255,255,255,0.04);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 28px;
  }
  .tab {
    flex: 1; padding: 9px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px; font-weight: 500; letter-spacing: 0.1em;
    color: var(--muted);
    background: none; border: none; border-radius: 9px;
    cursor: pointer; transition: all 0.25s;
    text-transform: uppercase;
  }
  .tab.active {
    background: linear-gradient(135deg, rgba(168,85,247,0.28), rgba(56,189,248,0.16));
    color: var(--text);
    box-shadow: 0 0 16px rgba(168,85,247,0.18);
  }

  .panel { display: none; animation: fadeIn 0.3s ease; }
  .panel.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .field { margin-bottom: 14px; }
  .field-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; letter-spacing: 0.15em;
    color: var(--muted); text-transform: uppercase;
    margin-bottom: 6px; display: block;
  }
  .inp-wrap { position: relative; }
  .inp-icon {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    font-size: 14px; opacity: 0.5; pointer-events: none;
  }
  .inp {
    width: 100%; padding: 12px 14px 12px 40px;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'Manrope', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .inp::placeholder { color: var(--muted); }
  .inp:focus {
    border-color: var(--border-hi);
    box-shadow: 0 0 0 3px rgba(168,85,247,0.12), 0 0 20px rgba(168,85,247,0.08);
  }

  .divider {
    display: flex; align-items: center; gap: 12px;
    margin: 18px 0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; color: var(--muted); letter-spacing: 0.1em;
  }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  .face-btn {
    width: 100%; padding: 13px;
    background: rgba(56,189,248,0.08);
    border: 1px solid rgba(56,189,248,0.28);
    border-radius: 12px;
    color: var(--accent2);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    transition: all 0.25s;
    position: relative; overflow: hidden;
  }
  .face-btn::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, rgba(56,189,248,0.06), transparent);
    transform: translateX(-100%); transition: transform 0.5s;
  }
  .face-btn:hover::before { transform: translateX(100%); }
  .face-btn:hover {
    background: rgba(56,189,248,0.14);
    border-color: rgba(56,189,248,0.5);
    box-shadow: 0 0 24px rgba(56,189,248,0.18);
    transform: translateY(-1px);
  }
  .face-btn:disabled {
    opacity: 0.5; cursor: not-allowed; transform: none;
  }
  .face-icon {
    width: 28px; height: 28px;
    border: 1.5px solid var(--accent2); border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; box-shadow: 0 0 10px rgba(56,189,248,0.25);
  }

  .submit-btn {
    width: 100%; margin-top: 18px; padding: 14px;
    background: linear-gradient(135deg, #7c3aed, #a855f7);
    border: none; border-radius: 12px;
    color: #fff;
    font-family: 'Orbitron', monospace;
    font-size: 12px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase;
    cursor: pointer; position: relative; overflow: hidden;
    transition: all 0.25s;
    box-shadow: 0 4px 20px rgba(168,85,247,0.35);
  }
  .submit-btn::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.12), transparent);
  }
  .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(168,85,247,0.5); }
  .submit-btn:active { transform: translateY(0); }

  .msg {
    padding: 10px 14px; border-radius: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; letter-spacing: 0.05em;
    margin-bottom: 14px; display: none;
    line-height: 1.5;
  }
  .msg.err { background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.3); color: var(--danger); display: block; }
  .msg.ok  { background: rgba(52,211,153,0.1);  border: 1px solid rgba(52,211,153,0.3);  color: var(--success); display: block; }

  .card-footer {
    margin-top: 24px; padding-top: 18px;
    border-top: 1px solid var(--border);
    font-size: 11px; color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    text-align: center; letter-spacing: 0.05em;
  }

  .corner { position: absolute; width: 14px; height: 14px; border-color: var(--accent); border-style: solid; opacity: 0.5; }
  .corner-tl { top: -1px; left: -1px;   border-width: 2px 0 0 2px; border-radius: 4px 0 0 0; }
  .corner-tr { top: -1px; right: -1px;  border-width: 2px 2px 0 0; border-radius: 0 4px 0 0; }
  .corner-bl { bottom: -1px; left: -1px;  border-width: 0 0 2px 2px; border-radius: 0 0 0 4px; }
  .corner-br { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; border-radius: 0 0 4px 0; }

  .eye-btn {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer;
    color: var(--muted); font-size: 14px; padding: 2px 4px;
    transition: color 0.2s;
  }
  .eye-btn:hover { color: var(--accent); }

  /* ── BIOMETRIC CAMERA SCANNER MODAL ── */
  .cam-modal-backdrop {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(3, 6, 18, 0.85);
    backdrop-filter: blur(14px);
    display: none; align-items: center; justify-content: center;
    padding: 20px;
    animation: fadeIn 0.25s ease;
  }
  .cam-modal-backdrop.open { display: flex; }

  .cam-modal-card {
    position: relative;
    width: 100%; max-width: 440px;
    background: rgba(12, 18, 38, 0.95);
    border: 1px solid var(--border-hi);
    border-radius: 20px;
    padding: 24px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.8), 0 0 40px rgba(56,189,248,0.2);
    text-align: center;
  }

  .cam-title {
    font-family: 'Orbitron', monospace;
    font-size: 13px; font-weight: 700;
    letter-spacing: 0.15em;
    color: var(--accent2);
    margin-bottom: 16px;
    text-transform: uppercase;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }

  .cam-viewport-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    background: #000;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid rgba(56,189,248,0.3);
    margin-bottom: 16px;
  }

  #cam-video {
    width: 100%; height: 100%;
    object-fit: cover;
    transform: scaleX(-1); /* mirror view for natural webcam experience */
  }

  .cam-scanline {
    position: absolute; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, transparent, #38bdf8, transparent);
    box-shadow: 0 0 12px #38bdf8;
    animation: scanAnimation 2s ease-in-out infinite alternate;
    pointer-events: none;
  }
  @keyframes scanAnimation {
    0%   { top: 5%; }
    100% { top: 92%; }
  }

  .cam-reticle {
    position: absolute; inset: 18%;
    border: 2px dashed rgba(56, 189, 248, 0.5);
    border-radius: 50%;
    pointer-events: none;
    box-shadow: inset 0 0 15px rgba(56, 189, 248, 0.15);
  }

  .cam-status {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text);
    margin-bottom: 16px;
    min-height: 18px;
  }

  .cam-btns {
    display: flex; gap: 10px;
  }
  .cam-btn-cap {
    flex: 2; padding: 12px;
    background: linear-gradient(135deg, #0284c7, #38bdf8);
    border: none; border-radius: 10px;
    color: #fff; font-family: 'Orbitron', monospace; font-size: 11px;
    font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
    cursor: pointer; transition: all 0.2s;
  }
  .cam-btn-cap:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(56,189,248,0.4); }
  .cam-btn-cancel {
    flex: 1; padding: 12px;
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border); border-radius: 10px;
    color: var(--muted); font-family: 'JetBrains Mono', monospace; font-size: 11px;
    cursor: pointer; transition: all 0.2s;
  }
  .cam-btn-cancel:hover { color: var(--text); background: rgba(255,255,255,0.1); }
</style>
</head>
<body>

<div id="cursor-glow"></div>
<div class="ambient">
  <div class="orb o1"></div>
  <div class="orb o2"></div>
  <div class="orb o3"></div>
</div>
<canvas id="star-canvas"></canvas>
<div class="grain"></div>

<div class="scene">
  <div class="auth-card" style="position:relative;">
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>

    <div class="brand">
      <span class="brand-star">✦</span> My Space
    </div>

    <div class="tab-row">
      <button class="tab active" id="tab-login"  onclick="switchTab('login')">Login</button>
      <button class="tab"        id="tab-signup" onclick="switchTab('signup')">Sign Up</button>
    </div>

    <div class="msg" id="msg-box"></div>

    <!-- LOGIN PANEL -->
    <div class="panel active" id="panel-login">
      <div class="field">
        <label class="field-label">Username</label>
        <div class="inp-wrap">
          <span class="inp-icon">◈</span>
          <input class="inp" id="login-user" type="text" placeholder="enter username" autocomplete="username">
        </div>
      </div>
      <div class="field">
        <label class="field-label">Password</label>
        <div class="inp-wrap">
          <span class="inp-icon">⬡</span>
          <input class="inp" id="login-pass" type="password" placeholder="••••••••" autocomplete="current-password">
          <button class="eye-btn" type="button" onclick="toggleEye('login-pass', this)">👁</button>
        </div>
      </div>

      <button class="submit-btn" id="btn-login-submit" onclick="handleLogin()">Access My Space →</button>

      <div class="divider">or</div>

      <button class="face-btn" id="face-login-btn" onclick="startBiometricFlow('login')">
        <div class="face-icon">🪪</div>
        <span>Login with Face Recognition</span>
      </button>
    </div>

    <!-- SIGNUP PANEL -->
    <div class="panel" id="panel-signup">
      <div class="field">
        <label class="field-label">Username</label>
        <div class="inp-wrap">
          <span class="inp-icon">◈</span>
          <input class="inp" id="signup-user" type="text" placeholder="choose a username" autocomplete="username">
        </div>
      </div>
      <div class="field">
        <label class="field-label">Password</label>
        <div class="inp-wrap">
          <span class="inp-icon">⬡</span>
          <input class="inp" id="signup-pass" type="password" placeholder="min 6 characters" autocomplete="new-password">
          <button class="eye-btn" type="button" onclick="toggleEye('signup-pass', this)">👁</button>
        </div>
      </div>
      <div class="field">
        <label class="field-label">Confirm Password</label>
        <div class="inp-wrap">
          <span class="inp-icon">⬡</span>
          <input class="inp" id="signup-confirm" type="password" placeholder="repeat password" autocomplete="new-password">
          <button class="eye-btn" type="button" onclick="toggleEye('signup-confirm', this)">👁</button>
        </div>
      </div>
      <div class="field">
        <label class="field-label">Secret Key</label>
        <div class="inp-wrap">
          <span class="inp-icon">🔑</span>
          <input class="inp" id="signup-key" type="password" placeholder="enter secret key">
        </div>
      </div>

      <button class="submit-btn" id="btn-signup-submit" onclick="handleSignup()">Create Account →</button>

      <div class="divider">or</div>

      <button class="face-btn" id="face-signup-btn" onclick="startBiometricFlow('register')">
        <div class="face-icon">🪪</div>
        <span>Register Face ID</span>
      </button>
    </div>

    <div class="card-footer">✦ My Space · Fast & Secure Biometric Auth</div>
  </div>
</div>

<!-- ── BIOMETRIC CAMERA SCANNER MODAL ── -->
<div class="cam-modal-backdrop" id="cam-modal">
  <div class="cam-modal-card">
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>

    <div class="cam-title" id="cam-title">✦ Biometric Face Scan</div>
    <div class="cam-viewport-wrap">
      <video id="cam-video" autoplay playsinline muted></video>
      <div class="cam-scanline"></div>
      <div class="cam-reticle"></div>
    </div>
    <div class="cam-status" id="cam-status">Align your face inside the circle…</div>
    <div class="cam-btns">
      <button class="cam-btn-cancel" onclick="closeBiometricModal()">Cancel</button>
      <button class="cam-btn-cap" id="cam-action-btn" onclick="triggerSnapshot()">Capture & Verify</button>
    </div>
  </div>
</div>

<script>
/* ── AUTO-REDIRECT IF ALREADY LOGGED IN ── */
(async function checkExistingAuth() {
  const token = localStorage.getItem('authToken');
  if (token) {
    try {
      const res = await fetch('/api/auth/verify', {
        headers: { 'Authorization': 'Bearer ' + token }
      });
      if (res.ok) {
        window.location.href = '/index.html';
      } else {
        localStorage.removeItem('authToken');
        localStorage.removeItem('loggedIn');
      }
    } catch {}
  }
})();

/* ── CURSOR ── */
const glowEl = document.getElementById('cursor-glow');
document.addEventListener('mousemove', e => {
  glowEl.style.left = e.clientX + 'px';
  glowEl.style.top  = e.clientY + 'px';
});

/* ── STARS ── */
const starCanvas = document.getElementById('star-canvas');
const ctx = starCanvas.getContext('2d');
let stars = [];
function initStars() {
  starCanvas.width  = window.innerWidth;
  starCanvas.height = window.innerHeight;
  stars = Array.from({ length: 150 }, () => ({
    x: Math.random() * starCanvas.width,
    y: Math.random() * starCanvas.height,
    r: Math.random() * 1.4 + 0.2,
    a: Math.random(),
    da: (Math.random() - 0.5) * 0.004,
  }));
}
function drawStars() {
  ctx.clearRect(0, 0, starCanvas.width, starCanvas.height);
  stars.forEach(s => {
    s.a = Math.max(0.05, Math.min(1, s.a + s.da));
    if (s.a <= 0.05 || s.a >= 1) s.da *= -1;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(200,185,255,${s.a})`;
    ctx.fill();
  });
  requestAnimationFrame(drawStars);
}
initStars();
drawStars();
window.addEventListener('resize', initStars);

/* ── TABS ── */
function switchTab(t) {
  document.getElementById('panel-login').classList.toggle('active', t === 'login');
  document.getElementById('panel-signup').classList.toggle('active', t === 'signup');
  document.getElementById('tab-login').classList.toggle('active', t === 'login');
  document.getElementById('tab-signup').classList.toggle('active', t === 'signup');
  clearMsg();
}

/* ── MESSAGES ── */
function showMsg(text, type = 'err') {
  const el = document.getElementById('msg-box');
  el.textContent = text;
  el.className = 'msg ' + type;
}
function clearMsg() {
  const el = document.getElementById('msg-box');
  el.textContent = '';
  el.className = 'msg';
}

/* ── EYE TOGGLE ── */
function toggleEye(id, btn) {
  const inp = document.getElementById(id);
  inp.type = inp.type === 'password' ? 'text' : 'password';
  btn.textContent = inp.type === 'password' ? '👁' : '🙈';
}

/* ── PASSWORD LOGIN ── */
async function handleLogin() {
  clearMsg();
  const user = document.getElementById('login-user').value.trim();
  const pass = document.getElementById('login-pass').value;
  if (!user || !pass) return showMsg('⚠ Please fill in all fields.');

  const btn = document.getElementById('btn-login-submit');
  btn.disabled = true;
  btn.textContent = 'Authenticating…';

  try {
    const res  = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: user, password: pass })
    });
    const data = await res.json();
    if (!res.ok) return showMsg('⚠ ' + (data.error || 'Login failed'));

    localStorage.setItem('loggedIn', 'true');
    localStorage.setItem('username', data.username);
    localStorage.setItem('authToken', data.token);

    showMsg('✓ Welcome back! Redirecting…', 'ok');
    setTimeout(() => { window.location.href = '/index.html'; }, 600);
  } catch (err) {
    showMsg('⚠ Server connection error: ' + err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Access My Space →';
  }
}

/* ── SIGNUP ── */
async function handleSignup() {
  clearMsg();
  const user    = document.getElementById('signup-user').value.trim();
  const pass    = document.getElementById('signup-pass').value;
  const confirm = document.getElementById('signup-confirm').value;
  const key     = document.getElementById('signup-key').value.trim();

  if (!user || !pass || !confirm || !key) return showMsg('⚠ Please fill in all fields.');
  if (pass.length < 6)  return showMsg('⚠ Password must be at least 6 characters.');
  if (pass !== confirm) return showMsg('⚠ Passwords do not match.');

  const btn = document.getElementById('btn-signup-submit');
  btn.disabled = true;
  btn.textContent = 'Creating Account…';

  try {
    const res  = await fetch('/api/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: user, password: pass, secretKey: key })
    });
    const data = await res.json();
    if (!res.ok) return showMsg('⚠ ' + (data.error || 'Registration failed'));

    localStorage.setItem('loggedIn', 'true');
    localStorage.setItem('username', data.username);
    localStorage.setItem('authToken', data.token);

    showMsg('✓ Account created! Redirecting…', 'ok');
    setTimeout(() => { window.location.href = '/index.html'; }, 600);
  } catch (err) {
    showMsg('⚠ Server connection error: ' + err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Create Account →';
  }
}

/* ══════════════════════════════════════════════════
   HIGH-SPEED BIOMETRIC CAMERA VIEWFINDER & CAPTURE
══════════════════════════════════════════════════ */
let activeStream = null;
let biometricMode = 'login'; // 'login' or 'register'
let autoCaptureTimer = null;

async function startBiometricFlow(mode) {
  clearMsg();
  biometricMode = mode;

  if (mode === 'register') {
    const user = document.getElementById('signup-user').value.trim();
    const key  = document.getElementById('signup-key').value.trim();
    if (!user || !key) {
      return showMsg('⚠ Please enter Username and Secret Key before registering Face ID.');
    }
  }

  const modal = document.getElementById('cam-modal');
  const title = document.getElementById('cam-title');
  const status = document.getElementById('cam-status');
  const actBtn = document.getElementById('cam-action-btn');

  title.textContent = mode === 'login' ? '✦ Biometric Face Login' : '✦ Register Face ID';
  status.textContent = 'Starting camera…';
  actBtn.disabled = true;
  modal.classList.add('open');

  try {
    activeStream = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: 'user' }
    });
    const video = document.getElementById('cam-video');
    video.srcObject = activeStream;

    await new Promise((resolve, reject) => {
      video.onloadedmetadata = () => { video.play().then(resolve).catch(reject); };
      video.onerror = reject;
    });

    status.textContent = 'Camera active. Position face in circle…';
    actBtn.disabled = false;

    // Optional quick auto-capture after 800ms
    autoCaptureTimer = setTimeout(() => {
      if (modal.classList.contains('open')) {
        triggerSnapshot();
      }
    }, 1200);

  } catch (err) {
    closeBiometricModal();
    showMsg('⚠ Camera access error: ' + (err.message || 'Permission denied'));
  }
}

function closeBiometricModal() {
  clearTimeout(autoCaptureTimer);
  const modal = document.getElementById('cam-modal');
  modal.classList.remove('open');
  if (activeStream) {
    activeStream.getTracks().forEach(t => t.stop());
    activeStream = null;
  }
}

// Optimized, lightweight frame extraction (~35KB JPEG)
function extractFrameData() {
  const video = document.getElementById('cam-video');
  const origW = video.videoWidth || 640;
  const origH = video.videoHeight || 480;

  // Max dimension 640px for ultra-fast network transfer & neural net processing
  const maxDim = 640;
  let w = origW, h = origH;
  if (w > maxDim || h > maxDim) {
    if (w >= h) {
      h = Math.round((origH * maxDim) / origW);
      w = maxDim;
    } else {
      w = Math.round((origW * maxDim) / origH);
      h = maxDim;
    }
  }

  const canvas = document.createElement('canvas');
  canvas.width  = w;
  canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0, w, h);

  return canvas.toDataURL('image/jpeg', 0.82);
}

async function triggerSnapshot() {
  clearTimeout(autoCaptureTimer);
  const status = document.getElementById('cam-status');
  const actBtn = document.getElementById('cam-action-btn');
  actBtn.disabled = true;
  status.textContent = 'Processing face scan…';

  const base64Image = extractFrameData();

  if (biometricMode === 'login') {
    try {
      const res = await fetch('/api/face-login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ image: base64Image })
      });
      const data = await res.json();

      if (!res.ok) {
        status.textContent = '❌ ' + (data.error || 'Face not recognized');
        actBtn.disabled = false;
        return;
      }

      status.textContent = `✓ Recognized as ${data.username}! (${data.confidence || 98}% match)`;
      localStorage.setItem('loggedIn', 'true');
      localStorage.setItem('username', data.username);
      localStorage.setItem('authToken', data.token);

      setTimeout(() => {
        closeBiometricModal();
        window.location.href = '/index.html';
      }, 500);

    } catch (err) {
      status.textContent = '⚠ Network error: ' + err.message;
      actBtn.disabled = false;
    }

  } else {
    // Face registration
    const user = document.getElementById('signup-user').value.trim();
    const key  = document.getElementById('signup-key').value.trim();

    try {
      const res = await fetch('/api/face-register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: user, secretKey: key, image: base64Image })
      });
      const data = await res.json();

      if (!res.ok) {
        status.textContent = '❌ ' + (data.error || 'Registration failed');
        actBtn.disabled = false;
        return;
      }

      status.textContent = `✓ Face profile saved for ${user}!`;
      localStorage.setItem('loggedIn', 'true');
      localStorage.setItem('username', user);
      localStorage.setItem('authToken', data.token);

      setTimeout(() => {
        closeBiometricModal();
        window.location.href = '/index.html';
      }, 600);

    } catch (err) {
      status.textContent = '⚠ Network error: ' + err.message;
      actBtn.disabled = false;
    }
  }
}

/* ── ENTER KEY ── */
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (document.getElementById('cam-modal').classList.contains('open')) {
    triggerSnapshot();
    return;
  }
  if (document.getElementById('panel-login').classList.contains('active')) handleLogin();
  else handleSignup();
});
</script>
